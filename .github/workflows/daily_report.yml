name: Daily Stock Report

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: regular-report
  cancel-in-progress: false

jobs:
  regular-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate regular report with coverage retry
        env:
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          mkdir -p config
          echo "$API_KEYS_JSON" > config/api_keys.json
          export PYTHONPATH=.

          for attempt in 1 2 3; do
            echo "regular-report attempt ${attempt}/3"
            if python src/jobs/generate_report.py --threshold 2000; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Report data is not ready yet. Retrying in 5 minutes..."
              sleep 300
            fi
          done

          echo "regular-report failed after retries; check data freshness and KOSPI/KOSDAQ coverage."
          exit 1

      - name: Publish report artifact
        uses: actions/upload-artifact@v4
        with:
          name: regular-stock-report
          path: reports/*.md
          if-no-files-found: error
