name: Daily Data Sync

on:
  schedule:
    - cron: '30 9 * * *' # 18:30 KST
  workflow_dispatch:

concurrency:
  group: daily-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install psycopg2-binary

    - name: Cache KIS token and OpenDart corp codes
      uses: actions/cache@v4
      with:
        path: |
          config/kis_token.json
          data/corp_codes.json
        key: ${{ runner.os }}-data-cache-${{ hashFiles('config/stock_universe.json') }}
        restore-keys: |
          ${{ runner.os }}-data-cache-

    - name: Run Pipelines
      env:
        API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
      run: |
        mkdir -p config
        echo "$API_KEYS_JSON" > config/api_keys.json
        export PYTHONPATH=.
        python scripts/apply_schema_migrations.py || echo "Schema migration skipped; continuing data sync"
        python -m src.pipelines.collect_ecos_macro --all
        python src/jobs/run_daily_macro_pipeline.py
        python src/jobs/run_daily_derivatives_pipeline.py
        python src/jobs/run_daily_stock_pipeline.py
        python src/jobs/run_daily_feature_pipeline.py
        python scripts/verify_data.py
