name: Daily Data Sync

on:
  schedule:
    - cron: '0 */3 * * *' # 매 3시간마다 실행
  workflow_dispatch: # 수동 실행 지원

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install psycopg2-binary # DB 초기화 등에 필요할 수 있음

    - name: Cache KIS token and OpenDart corp codes
      uses: actions/cache@v3
      with:
        path: |
          config/kis_token.json
          data/corp_codes.json
        key: ${{ runner.os }}-data-cache-${{ hashFiles('config/stock_universe.json') }}
        restore-keys: |
          ${{ runner.os }}-data-cache-

    - name: Run Pipelines
      env:
        API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
      run: |
        mkdir -p config
        echo "$API_KEYS_JSON" > config/api_keys.json
        export PYTHONPATH=.
        python src/jobs/run_daily_macro_pipeline.py
        python src/jobs/run_daily_stock_pipeline.py
        python src/jobs/run_daily_feature_pipeline.py
