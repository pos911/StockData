name: Daily Data Sync

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '10 7 * * 1-5'
    - cron: '0 2,4,6 * * 1-5'
    - cron: '20 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: daily-sync
  cancel-in-progress: true

jobs:
  hourly_light_sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
      - name: Run light sync
        env:
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          mkdir -p config
          echo "$API_KEYS_JSON" > config/api_keys.json
          export PYTHONPATH=.
          python scripts/apply_schema_migrations.py || echo "Schema migration skipped; continuing"
          python -m src.pipelines.collect_ecos_macro --all
          python src/jobs/run_daily_macro_pipeline.py
          python src/jobs/run_daily_derivatives_pipeline.py
          python scripts/verify_data.py

  daily_master_sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '10 7 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
      - name: Run market master sync
        env:
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          mkdir -p config
          echo "$API_KEYS_JSON" > config/api_keys.json
          export PYTHONPATH=.
          python src/jobs/run_daily_master_pipeline.py

  daily_ranking_sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2,4,6 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
      - name: Run ranking sync
        env:
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          mkdir -p config
          echo "$API_KEYS_JSON" > config/api_keys.json
          export PYTHONPATH=.
          python src/jobs/run_daily_ranking_pipeline.py

  daily_stock_detail_sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 7 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
      - name: Run stock detail sync
        env:
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          mkdir -p config
          echo "$API_KEYS_JSON" > config/api_keys.json
          export PYTHONPATH=.
          python src/jobs/run_daily_stock_pipeline.py
          python src/jobs/run_daily_feature_pipeline.py
          python scripts/verify_data.py
