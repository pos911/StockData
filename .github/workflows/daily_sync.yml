name: Daily Data Sync

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '20 7 * * 1-5'
  workflow_dispatch:
    inputs:
      sync_scope:
        description: "hourly or daily"
        required: false
        default: "daily"

concurrency:
  group: daily-sync
  cancel-in-progress: true

jobs:
  hourly_light_sync:
    if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.sync_scope == 'hourly')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
      - name: Run hourly light sync
        env:
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          echo "schedule_scope=hourly_light_sync"
          echo "pipeline_order=macro -> derivatives -> daily_kis_universe_detail_sync -> feature -> verify"
          mkdir -p config
          echo "$API_KEYS_JSON" > config/api_keys.json
          export PYTHONPATH=.
          python scripts/apply_schema_migrations.py || echo "Schema migration skipped; continuing"
          python -m src.pipelines.collect_ecos_macro --all
          python src/jobs/run_daily_macro_pipeline.py
          python src/jobs/run_intraday_macro_pipeline.py
          python src/jobs/run_daily_derivatives_pipeline.py
          python -m src.jobs.run_daily_kis_universe_pipeline --limit 100
          python src/jobs/run_daily_feature_pipeline.py
          python scripts/verify_data.py

  daily_market_pipeline:
    if: github.event.schedule == '20 7 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.sync_scope != 'hourly')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
      - name: Run daily market pipeline
        env:
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          echo "schedule_scope=daily_market_pipeline"
          echo "pipeline_order=daily_master_sync -> daily_ranking_sync -> daily_kis_universe_detail_sync -> feature -> verify"
          mkdir -p config
          echo "$API_KEYS_JSON" > config/api_keys.json
          export PYTHONPATH=.
          python src/jobs/run_daily_master_pipeline.py
          python src/jobs/run_daily_ranking_pipeline.py
          python -m src.jobs.run_daily_kis_universe_pipeline --limit 100
          python src/jobs/run_daily_feature_pipeline.py
          python scripts/verify_data.py
